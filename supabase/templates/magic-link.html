<!-- FORMA sign-in email. Paste into Supabase > Authentication > Emails > Magic link.
     Subject: Your FORMA sign-in link -->
<div style="margin:0;padding:32px 16px;background:#0b0d14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#e2e8f0">
  <div style="max-width:420px;margin:0 auto;background:#11141f;border:1px solid #232840;border-radius:16px;padding:32px 24px;text-align:center">
    <img src="https://formaquest.app/icon-192.png" width="64" height="64" alt="" style="display:block;margin:0 auto 16px;border-radius:12px;image-rendering:pixelated">
    <div style="font-family:'Courier New',Courier,monospace;font-size:28px;font-weight:bold;letter-spacing:4px;color:#fbbf24">FORMA</div>
    <p style="margin:20px 0 4px;font-size:16px;color:#e2e8f0">Your hero is waiting by the fire.</p>
    <p style="margin:0 0 24px;font-size:14px;color:#94a3b8">Tap below to sign in and keep your save safe.</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#fbbf24;color:#0b0d14;font-weight:bold;font-size:15px;text-decoration:none;padding:14px 28px;border-radius:12px">Sign in to FORMA</a>
    <p style="margin:24px 0 8px;font-size:13px;color:#94a3b8">Or type this code in the app:</p>
    <div style="font-family:'Courier New',Courier,monospace;font-size:30px;font-weight:bold;letter-spacing:8px;color:#fde68a">{{ .Token }}</div>
    <p style="margin:24px 0 0;font-size:12px;color:#64748b">The link and the code work once, for one hour. If you didn't ask for it, you can ignore this email.</p>
  </div>
</div>
