# FORMA's server: one box running this stack, the same shape as minlit's (see
# docs/handbook/backend/server.md). Caddy is the only public door; Postgres is loopback only.
# Settings come from .env next to this file (template: .env.example).

services:
  postgres:
    image: postgres:17-alpine
    # Loopback only: reachable from the box (psql, backups), never from the internet. The api
    # reaches it over the compose network as postgres:5432.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: forma
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forma_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "forma", "-d", "forma"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    # On the server this image comes from GHCR and is swapped in with a zero-downtime
    # `docker rollout api` (scripts/deploy/). `build:` is the local fallback.
    image: ghcr.io/damicoedoardo/forma-api:latest
    build: ./backend
    # No host port: `docker rollout` briefly runs two api containers side by side, which would
    # clash on a fixed port. Caddy reaches it as api:8000.
    expose:
      - "8000"
    environment:
      - FORMA_ENV=production
      - FORMA_DATABASE_URL=postgresql://forma:${POSTGRES_PASSWORD:-forma_dev}@postgres:5432/forma
      - FORMA_SUPABASE_ISSUER=${SUPABASE_ISSUER:-}
      - FORMA_SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL:-}
      - FORMA_CORS_ORIGINS=${CORS_ORIGINS:-https://forma-nu-red.vercel.app,http://localhost:3000}
      # Party voice: the address phones join, and the key pair LiveKit trusts (same as LIVEKIT_KEYS).
      - FORMA_LIVEKIT_URL=${LIVEKIT_URL:-}
      - FORMA_LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - FORMA_LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      # The coach: the LiteLLM proxy below, under its master key. Empty: the coach is off.
      - FORMA_LITELLM_URL=http://litellm:4000
      - FORMA_LITELLM_KEY=${LITELLM_MASTER_KEY:-}
      # Live party runs: where phones find the game server, and the secret its passes are signed
      # with. Empty: no live runs, a party plays with bots as before.
      - FORMA_PLAY_URL=${PLAY_URL:-}
      - FORMA_PLAY_SECRET=${PLAY_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  livekit:
    # Party voice. Talk goes straight to the phones over UDP 7882 (TCP 7881 as a fallback); the
    # join itself comes through Caddy at VOICE_DOMAIN as livekit:7880.
    image: livekit/livekit-server:v1.13.10
    command: --config /etc/livekit.yaml
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-forma_dev_secret_change_me_0000000}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    expose:
      - "7880"
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    restart: unless-stopped

  litellm:
    # The LLM proxy for the coach, as on minlit: the api asks it for `forma-coach`, and
    # litellm-config.yaml maps that to the real model on OpenRouter. Pinned tag, never :latest.
    # Loopback only: the api reaches it as litellm:4000; an SSH port-forward reaches its /ui.
    image: ghcr.io/berriai/litellm:main-v1.50.0
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped

  play:
    # The game server for live party runs: one real run per party, played by the app's own engine.
    # Built here from the repo (no image registry): `docker compose up -d --build play`. Caddy brings
    # wss://<DOMAIN>/play to it as play:8090. A restart ends the runs going on (phones fall back).
    build:
      context: .
      dockerfile: play/Dockerfile
    expose:
      - "8090"
    environment:
      # Shared with the api, which signs the passes (FORMA_PLAY_SECRET below).
      - PLAY_SECRET=${PLAY_SECRET:-}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - VOICE_DOMAIN=${VOICE_DOMAIN:-voice.localhost}
    volumes:
      # A directory mount, so a `git pull` that replaces the Caddyfile is seen after a reload.
      - ./caddy:/etc/caddy
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
