name: Deploy backend

# Builds the backend image and pushes it to GHCR when backend code lands on main. The server polls
# GHCR every 2 minutes and rolls the new image out (scripts/deploy/README.md). Same as minlit's.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  # One build at a time so :latest only moves forward; never cancel a push mid-upload.
  group: deploy-backend
  cancel-in-progress: false

jobs:
  # Tests again here: this is what ships, and a direct push must not deploy untested code.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run pytest -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/forma-api
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One plain manifest, so the server's digest check against :latest is exact.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
